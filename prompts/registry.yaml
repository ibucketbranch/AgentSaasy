# ═══════════════════════════════════════════════════════════════════
# AgentSaasy_NGAI — Prompt Library Registry
# ═══════════════════════════════════════════════════════════════════
#
# Central catalog of all prompts used in the project.
# Each entry tracks metadata for versioning, categorization, and reuse.
#
# Best Practices (IEEE/Google-style prompt management):
#   1. Every prompt has a unique slug (id) and semantic version
#   2. Prompts are categorized by domain and use-case
#   3. Variables use {{variable_name}} templating syntax
#   4. Token estimates help predict API cost per invocation
#   5. Each prompt file lives in prompts/<slug>.md or prompts/<slug>.txt
#   6. Changes to prompts get versioned — never silently overwrite
# ═══════════════════════════════════════════════════════════════════

schema_version: "1.0"
project: "AgentSaasy_NGAI"
last_updated: "2026-02-11"

# ─── Categories ─────────────────────────────────────────────────
categories:
  system:
    description: "Core system prompts that define agent identity and behavior"
  demo:
    description: "Demo orchestration prompts for live presentations"
  act:
    description: "Individual demo act prompts (one per agent showcase)"
  query:
    description: "Pre-built query templates for common asset management scenarios"
  generation:
    description: "Long-form document generation briefs (white papers, reports, proposals)"

# ─── Prompt Entries ─────────────────────────────────────────────
prompts:

  # ── System Prompts ──────────────────────────────────────────
  - id: "system-asset-agent"
    name: "Asset Management Agent System Prompt"
    file: "system_asset_agent.md"
    version: "2.0.0"
    category: "system"
    description: >
      Core system prompt for the 5-tool asset management agent.
      Defines identity, tools, guidelines, reasoning pattern, output
      format, and worked example. Uses Anthropic XML-tagged structure
      for unambiguous section boundaries.
    model: "gpt-4o-mini"
    est_tokens: 550
    variables: []
    author: "AgentSaasy Team"
    created: "2026-02-11"

  # ── Demo Master Prompt ──────────────────────────────────────
  - id: "demo-master-showcase"
    name: "NEXGEN AI Agent Demo Showcase — Master Prompt"
